[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1_000

[rpc_endpoints]
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
arbitrum_one = "https://arb1.arbitrum.io/rpc"
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"
hyperevm = "https://rpc.hyperliquid.xyz/evm"
monad_testnet = "https://testnet-rpc.monad.xyz"
monad = "https://rpc.monad.xyz"

# Etherscan-family explorers. Blockscout needs no key: pass
# --verifier blockscout --verifier-url <explorer>/api/ instead.
[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
arbitrum_one = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
hyperevm = { key = "${ETHERSCAN_API_KEY}", chain = 999 }
