# One BorneoCheckout deployment on one chain.
type Checkout {
  # checkout contract address, lowercase
  id: ID!
  feeBps: Int!
  treasury: String!
  paused: Boolean!
  orderCount: Int!
  grossVolume: BigInt!
  feeVolume: BigInt!
  pointsIssued: BigInt!
  merchantCount: Int!
  buyerCount: Int!
  updatedAt: BigInt!
}

# A settled order. id is the on-chain orderId (keccak256 of the app order id).
type Order @index(fields: ["buyer", ["timestamp", "DESC"]]) @index(fields: ["merchant", ["timestamp", "DESC"]]) {
  id: ID!
  checkout: String!
  merchant: Merchant!
  buyer: Buyer!
  token: Token!
  amount: BigInt!
  fee: BigInt!
  # amount - fee: what the merchant received
  net: BigInt!
  points: BigInt!
  # protocol fee in bps at the time of the order
  feeBps: Int!
  day: DailyStat!
  txHash: String!
  blockNumber: Int!
  timestamp: BigInt! @index
}

type Merchant {
  # payout address, lowercase
  id: ID!
  orders: [Order!]! @derivedFrom(field: "merchant")
  orderCount: Int!
  grossVolume: BigInt!
  netVolume: BigInt!
  feesPaid: BigInt!
  uniqueBuyers: Int!
  repeatBuyers: Int!
  firstSaleAt: BigInt!
  lastSaleAt: BigInt!
}

type Buyer {
  # payer (passkey wallet) address, lowercase
  id: ID!
  orders: [Order!]! @derivedFrom(field: "buyer")
  orderCount: Int!
  spent: BigInt!
  # mirrors BorneoCheckout.xpoints(payer)
  xpoints: BigInt!
  merchantCount: Int!
  firstOrderAt: BigInt!
  lastOrderAt: BigInt!
}

# Who bought from whom, for unique and repeat buyer counts.
type MerchantBuyer {
  # `${merchant}-${buyer}`
  id: ID!
  merchant: Merchant!
  buyer: Buyer!
  orderCount: Int!
  spent: BigInt!
}

type Token {
  # token address, lowercase
  id: ID!
  allowed: Boolean!
  orders: [Order!]! @derivedFrom(field: "token")
  orderCount: Int!
  volume: BigInt!
  fees: BigInt!
}

# UTC day rollup: orders, volume, fees and active buyers per day.
type DailyStat {
  # days since epoch, as a string
  id: ID!
  date: String!
  dayStart: BigInt! @index
  orders: [Order!]! @derivedFrom(field: "day")
  orderCount: Int!
  volume: BigInt!
  fees: BigInt!
  points: BigInt!
  activeBuyers: Int!
}

# Marks a buyer as already counted for a day.
type DailyBuyer {
  # `${day}-${buyer}`
  id: ID!
  day: DailyStat!
}
